services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: selftalk_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - selftalk
    depends_on:
      - db
      - redis
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-selftalk}
      - DB_USERNAME=${DB_USERNAME:-selftalk}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  nginx:
    image: nginx:alpine
    container_name: selftalk_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - selftalk
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    container_name: selftalk_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-selftalk}
      POSTGRES_USER: ${DB_USERNAME:-selftalk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - selftalk

  redis:
    image: redis:7-alpine
    container_name: selftalk_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    networks:
      - selftalk

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: selftalk_reverb
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - ./:/var/www
    ports:
      - "${REVERB_PORT:-8080}:8080"
    networks:
      - selftalk
    depends_on:
      - app
      - redis
    environment:
      - REVERB_HOST=0.0.0.0
      - REVERB_PORT=8080
      - REDIS_HOST=redis

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: selftalk_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    volumes:
      - ./:/var/www
    networks:
      - selftalk
    depends_on:
      - app
      - db
      - redis

networks:
  selftalk:
    driver: bridge

volumes:
  dbdata:
    driver: local
  redisdata:
    driver: local